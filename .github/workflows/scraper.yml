name: Automated Impact Scraper Pipeline

on:
  schedule:
    # Runs every 6 hours automatically (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  # Allows manual one-click trigger from GitHub Actions tab anytime
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies & Playwright Browsers
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests beautifulsoup4 gspread google-auth python-dotenv firebase-admin
          playwright install chromium --with-deps

      - name: Execute Live Scraper Pipeline
        id: scraper
        env:
          MANAGEMENT_PORTAL_URL: ${{ secrets.MANAGEMENT_PORTAL_URL }}
          MANAGEMENT_PORTAL_EMAIL: ${{ secrets.MANAGEMENT_PORTAL_EMAIL }}
          MANAGEMENT_PORTAL_PASSWORD: ${{ secrets.MANAGEMENT_PORTAL_PASSWORD }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          python src/scripts/agents/pipeline.py

      # Always runs — even if the pipeline step above fails
      # This lets us download the screenshot and see exactly what the browser saw
      - name: Upload Portal Debug Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-debug-screenshot
          path: portal_debug.png
          if-no-files-found: warn
          retention-days: 7

      # Always runs — shows all files created during the run for extra visibility
      - name: List Generated Files (Debug)
        if: always()
        run: |
          echo "=== Files in root directory ==="
          ls -la *.png *.json *.html 2>/dev/null || echo "No debug files found in root"
          echo "=== Scraper Data Store ==="
          cat src/data/liveImpactStore.json 2>/dev/null || echo "liveImpactStore.json not found"
